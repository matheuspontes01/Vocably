server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Mesmo papel do proxy do Vite em desenvolvimento: o navegador fala só com o Nginx,
    # e o Nginx repassa as chamadas da API para o container "backend" (sem precisar de CORS).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Rotas do React (/words, /review...) não são arquivos: devolve o index.html
    # e o React Router decide qual página mostrar.
    location / {
        try_files $uri /index.html;
    }
}
