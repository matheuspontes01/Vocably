services:
  postgres:
    image: postgres:17-alpine
    container_name: vocably-postgres
    environment:
      POSTGRES_DB: vocably
      POSTGRES_USER: vocably
      POSTGRES_PASSWORD: vocably
    ports:
      - "5432:5432"
    volumes:
      - vocably-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vocably -d vocably"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vocably-pgdata:
